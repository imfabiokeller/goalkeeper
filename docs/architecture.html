<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goalkeeper architecture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
  :root {
    --bg: #F4F5F2;
    --card: #FFFFFF;
    --ink: #151C22;
    --muted: #6E7883;
    --line: #D3D8D5;
    --goal: #C2690F;
    --goal-fill: #FBE9D5;
    --lib: #2563A8;
    --lib-fill: #DCE8F6;
    --never: #C0392B;
    --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0D1116;
      --card: #131A20;
      --ink: #E9EDEA;
      --muted: #8E9AA5;
      --line: #2E3942;
      --goal: #F4A65A;
      --goal-fill: #33220F;
      --lib: #7FB6EE;
      --lib-fill: #10243A;
      --never: #F07167;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0D1116;
    --card: #131A20;
    --ink: #E9EDEA;
    --muted: #8E9AA5;
    --line: #2E3942;
    --goal: #F4A65A;
    --goal-fill: #33220F;
    --lib: #7FB6EE;
    --lib-fill: #10243A;
    --never: #F07167;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    padding-block: 32px 40px;
    padding-inline: 16px;
  }
  main { max-width: 1280px; margin: 0 auto; }
  .frame { overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; min-width: 760px; max-width: 100%; color: var(--ink); }

  .name { font-family: var(--display); font-weight: 700; font-size: 26px; fill: var(--ink); letter-spacing: -0.01em; }
  .name-goal { fill: var(--goal); }
  .name-lib { fill: var(--lib); }
  .step { font-family: var(--display); font-weight: 600; font-size: 17px; fill: var(--ink); }
  .label { font-family: var(--mono); font-size: 12px; fill: var(--muted); letter-spacing: 0.02em; }
  .label-goal { fill: var(--goal); }
  .label-lib { fill: var(--lib); }
  .label-never { fill: var(--never); font-weight: 500; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 20px; fill: var(--ink); }
  .brand-sub { font-family: var(--mono); font-size: 12px; fill: var(--muted); }

  .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  .card-goal { fill: var(--goal-fill); stroke: var(--goal); stroke-width: 2; }
  .card-lib { fill: var(--lib-fill); stroke: var(--lib); stroke-width: 2; }
  .ghost { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  .worker { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
  .pill { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
  .band { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 7 5; }
  .atlas { font-family: var(--display); font-weight: 700; font-size: 16px; fill: var(--ink); }
  .planner { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .bar { fill: var(--lib); opacity: 0.55; }

  .flow { fill: none; stroke: var(--ink); stroke-width: 1.75; }
  .flow-goal { fill: none; stroke: var(--goal); stroke-width: 2.25; }
  .flow-lib { fill: none; stroke: var(--lib); stroke-width: 2.25; }
  .flow-never { fill: none; stroke: var(--never); stroke-width: 2; stroke-dasharray: 5 4; }
  .x { stroke: var(--never); stroke-width: 3.5; stroke-linecap: round; }
  .head { fill: var(--ink); }
  .head-goal { fill: var(--goal); }
  .head-lib { fill: var(--lib); }
</style>

<main>
  <div class="frame">
  <svg viewBox="0 0 1280 640" role="img" aria-label="goalkeeper architecture: a human writes the goal once. On Atlas, the goal is small and hot, the library is raw and grows all day, and nothing ever moves from the library to the goal. Each stateless worker claims a task from the queue, assembles a fifteen thousand token slice from the pinned goal and the library, runs a cheap model with tools, passes a deterministic gate, and writes the raw run back to the library. The planner is a function any idle worker runs under a lock.">
    <defs>
      <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
      <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-goal"/></marker>
      <marker id="hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-lib"/></marker>
    </defs>

    <!-- brand -->
    <text x="1200" y="58" text-anchor="end" class="brand">goalkeeper</text>
    <text x="1200" y="78" text-anchor="end" class="brand-sub">distributed agents, one memory, one goal</text>

    <!-- human -->
    <rect x="330" y="36" width="160" height="40" rx="20" class="card"/>
    <text x="410" y="62" text-anchor="middle" class="step">Human</text>
    <path d="M410,76 V138" class="flow-goal" marker-end="url(#hg)"/>
    <text x="422" y="112" class="label label-goal">writes it once</text>

    <!-- atlas band -->
    <rect x="56" y="118" width="1168" height="166" rx="12" class="band"/>
    <text x="72" y="272" class="atlas">MongoDB Atlas</text>
    <text x="214" y="272" class="label">queue · memory · ledger · search · vector</text>

    <!-- tasks -->
    <rect x="80" y="140" width="160" height="100" rx="8" class="card"/>
    <text x="104" y="178" class="step">Tasks</text>
    <text x="104" y="202" class="label">queue · ledger</text>

    <!-- goal -->
    <rect x="280" y="140" width="260" height="100" rx="8" class="card-goal"/>
    <text x="304" y="180" class="name name-goal">Goal</text>
    <text x="304" y="206" class="label label-goal">hot · human · never rewritten</text>

    <!-- never -->
    <path d="M600,190 H542" class="flow-never" marker-end="url(#h)"/>
    <line x1="561" y1="181" x2="579" y2="199" class="x"/>
    <line x1="579" y1="181" x2="561" y2="199" class="x"/>
    <text x="570" y="168" text-anchor="middle" class="label label-never">never</text>

    <!-- library -->
    <rect x="600" y="140" width="600" height="100" rx="8" class="card-lib"/>
    <text x="624" y="180" class="name name-lib">Library</text>
    <text x="624" y="206" class="label label-lib">cold · raw · append-only · grows all day</text>
    <rect x="1010" y="220" width="14" height="10" class="bar"/>
    <rect x="1032" y="214" width="14" height="16" class="bar"/>
    <rect x="1054" y="206" width="14" height="24" class="bar"/>
    <rect x="1076" y="196" width="14" height="34" class="bar"/>
    <rect x="1098" y="186" width="14" height="44" class="bar"/>
    <rect x="1120" y="174" width="14" height="56" class="bar"/>
    <rect x="1142" y="162" width="14" height="68" class="bar"/>
    <rect x="1164" y="156" width="14" height="74" class="bar"/>

    <!-- worker stack -->
    <rect x="310" y="350" width="720" height="250" rx="10" class="ghost"/>
    <rect x="300" y="340" width="720" height="250" rx="10" class="ghost"/>
    <rect x="290" y="330" width="720" height="250" rx="10" class="worker"/>
    <text x="990" y="364" text-anchor="end" class="step">Worker</text>
    <text x="990" y="384" text-anchor="end" class="label">stateless · disposable · × N</text>
    <text x="990" y="402" text-anchor="end" class="label">Vercel AI SDK · OpenRouter · Docker</text>

    <!-- steps -->
    <rect x="323" y="440" width="110" height="52" rx="26" class="pill"/>
    <text x="378" y="472" text-anchor="middle" class="step">claim</text>
    <rect x="459" y="440" width="110" height="52" rx="26" class="pill"/>
    <text x="514" y="472" text-anchor="middle" class="step">assemble</text>
    <rect x="595" y="440" width="110" height="52" rx="26" class="pill"/>
    <text x="650" y="472" text-anchor="middle" class="step">run</text>
    <rect x="731" y="440" width="110" height="52" rx="26" class="pill"/>
    <text x="786" y="472" text-anchor="middle" class="step">gate</text>
    <rect x="867" y="440" width="110" height="52" rx="26" class="pill"/>
    <text x="922" y="472" text-anchor="middle" class="step">write</text>

    <path d="M433,466 H457" class="flow" marker-end="url(#h)"/>
    <path d="M569,466 H593" class="flow" marker-end="url(#h)"/>
    <path d="M705,466 H729" class="flow" marker-end="url(#h)"/>
    <path d="M841,466 H865" class="flow" marker-end="url(#h)"/>

    <text x="378" y="520" text-anchor="middle" class="label">atomic</text>
    <text x="514" y="520" text-anchor="middle" class="label">4k · flat</text>
    <text x="650" y="520" text-anchor="middle" class="label">cheap model + tools</text>
    <text x="786" y="520" text-anchor="middle" class="label">deterministic</text>
    <text x="922" y="520" text-anchor="middle" class="label">then exit</text>

    <!-- flows into the worker -->
    <path d="M160,240 V466 H321" class="flow" marker-end="url(#h)"/>

    <path d="M420,240 V300 H500 V438" class="flow-goal" marker-end="url(#hg)"/>
    <text x="432" y="294" class="label label-goal">pinned</text>

    <path d="M700,240 V312 H530 V438" class="flow-lib" marker-end="url(#hl)"/>
    <text x="712" y="308" class="label label-lib">a slice</text>

    <path d="M922,438 V242" class="flow-lib" marker-end="url(#hl)"/>
    <text x="934" y="300" class="label label-lib">raw run</text>

    <!-- planner -->
    <rect x="1040" y="330" width="160" height="250" rx="10" class="planner"/>
    <text x="1064" y="364" class="step">Planner</text>
    <text x="1064" y="384" class="label">any idle worker</text>
    <text x="1064" y="424" class="label">reap</text>
    <text x="1064" y="448" class="label">emit</text>
    <text x="1064" y="472" class="label">score</text>
    <text x="1064" y="496" class="label">reopen</text>
    <path d="M1120,328 V242" class="flow" marker-end="url(#h)"/>
  </svg>
  </div>
</main>
</body>
</html>
